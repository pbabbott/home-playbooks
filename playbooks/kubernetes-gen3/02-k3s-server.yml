# ansible-playbook -i inventories/gen3 ./playbooks/kubernetes-gen3/02-k3s-server.yml
# Embedded etcd: controller 1 runs --cluster-init, the other controllers join it one at a time (3 members).
- name: Install k3s server (first controller, cluster-init)
  hosts: kubernetes_controllers[0]
  become: true
  vars:
    k3s_version: v1.35.10+k3s1 # gen2 runs Kubernetes 1.35
  handlers:
    - name: Restart k3s
      ansible.builtin.systemd:
        name: k3s
        state: restarted
  tasks:
    - name: Create k3s config dir
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: "0755"

    - name: Write k3s server config
      ansible.builtin.template:
        src: ./files/k3s-server-config.yaml.j2
        dest: /etc/rancher/k3s/config.yaml
        mode: "0600"
      notify: Restart k3s

    - name: Download k3s install script
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /usr/local/bin/k3s-install.sh
        mode: "0755"

    - name: Install k3s server
      ansible.builtin.command: /usr/local/bin/k3s-install.sh
      args:
        creates: /usr/local/bin/k3s
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
        INSTALL_K3S_EXEC: server

    - name: Ensure k3s is running
      ansible.builtin.systemd:
        name: k3s
        state: started
        enabled: true

    - name: Wait for the API server
      ansible.builtin.command: k3s kubectl get --raw /readyz
      register: readyz
      until: readyz.rc == 0
      retries: 30
      delay: 5
      changed_when: false

    - name: Fetch kubeconfig to the control machine (~/.kube/gen3-config)
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: k3s_kubeconfig

    - name: Ensure local ~/.kube exists
      delegate_to: localhost
      become: false
      ansible.builtin.file:
        path: ~/.kube
        state: directory
        mode: "0700"

    - name: Save kubeconfig locally with the controller IP
      delegate_to: localhost
      become: false
      ansible.builtin.copy:
        content: "{{ k3s_kubeconfig.content | b64decode | replace('127.0.0.1', ansible_host) | replace('default', 'gen3') }}"
        dest: ~/.kube/gen3-config
        mode: "0600"

    - name: Read the node join token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_node_token
      no_log: true

- name: Join additional k3s servers (embedded etcd members)
  hosts: kubernetes_controllers[1:]
  become: true
  serial: 1 # one new etcd member at a time; never lose quorum while joining
  vars:
    k3s_version: v1.35.10+k3s1
  handlers:
    - name: Restart k3s
      ansible.builtin.systemd:
        name: k3s
        state: restarted
  pre_tasks:
    - name: Read join token from the first controller when running this play alone
      when: hostvars[groups['kubernetes_controllers'][0]]['k3s_node_token'] is not defined
      delegate_to: "{{ groups['kubernetes_controllers'][0] }}"
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: token_alone
      no_log: true

    - name: Share the token as a first-controller fact
      when: token_alone is not skipped
      ansible.builtin.set_fact:
        k3s_node_token: "{{ token_alone }}"
      delegate_to: "{{ groups['kubernetes_controllers'][0] }}"
      delegate_facts: true
      run_once: true
      no_log: true
  tasks:
    - name: Create k3s config dir
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: "0755"

    - name: Write k3s server join config
      ansible.builtin.template:
        src: ./files/k3s-server-join-config.yaml.j2
        dest: /etc/rancher/k3s/config.yaml
        mode: "0600"
      no_log: true
      notify: Restart k3s

    - name: Download k3s install script
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /usr/local/bin/k3s-install.sh
        mode: "0755"

    - name: Install k3s server
      ansible.builtin.command: /usr/local/bin/k3s-install.sh
      args:
        creates: /usr/local/bin/k3s
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
        INSTALL_K3S_EXEC: server

    - name: Ensure k3s is running
      ansible.builtin.systemd:
        name: k3s
        state: started
        enabled: true

    - name: Wait for this node to be Ready
      ansible.builtin.command: k3s kubectl get node {{ inventory_hostname }} -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
      register: node_ready
      until: node_ready.stdout == "True"
      retries: 60
      delay: 10
      changed_when: false
