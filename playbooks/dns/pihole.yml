# ansible-playbook -e @./vault.yml playbooks/dns/pihole.yml

- name: Install pihole
  hosts:
    - bananapi
  handlers:
    - name: Restart pihole
      community.docker.docker_container:
        name: pihole
        restart: true
  vars:
    pihole_backup_dir: /mnt/pihole_backups
  tasks:

    - name: Setup config directories
      block:
        - name: "Ensure pihole app config directory exists"
          ansible.builtin.file:
            path: "{{ pihole_config_dir }}"
            state: directory
            mode: '0755'

        - name: "Ensure etc-pihole directory exists"
          ansible.builtin.file:
            path: "{{ pihole_config_dir }}/etc-pihole"
            state: directory
            mode: '0755'

        - name: "Ensure dnsmasq.d directory exists"
          ansible.builtin.file:
            path: "{{ pihole_config_dir }}/etc-dnsmasq.d"
            state: directory
            mode: '0755'

    - name: Setup config files
      block:
        # Plan is to use external-dns to manage CNAME records
        # - name: Copy cname records to remote
        #   register: dns_records
        #   notify:
        #     - Restart pihole
        #   ansible.builtin.copy:
        #     src: ./files/pihole/05-pihole-custom-cname.conf
        #     dest: "{{ pihole_config_dir }}/etc-dnsmasq.d/05-pihole-custom-cname.conf"

        # custom.list is deliberately NOT managed here (home-playbooks#35). Pi-hole v5 stores every local DNS record in
        # /etc/pihole/custom.list, and external-dns (home-kubernetes, policy=sync, registry=noop) owns that file's
        # contents: copying a file over it wipes all external-dns records until the next sync, and external-dns deletes
        # any static line it does not own. Add host records as DNSEndpoints in home-kubernetes instead.

        - name: Copy internal dnsmasq config remote
          notify:
            - Restart pihole
          ansible.builtin.copy:
            src: ./files/pihole/02-internal.conf
            dest: "{{ pihole_config_dir }}/etc-dnsmasq.d/02-internal.conf"

    # - name: Mount an NFS volume
    #   ansible.posix.mount:
    #     src: 192.168.4.124:/volume1/Backups/pihole
    #     path: "{{ pihole_backup_dir }}"
    #     opts: rw,sync,hard
    #     state: mounted
    #     fstype: nfs

    - name: Ensure pihole is running
      community.docker.docker_compose:
        project_name: pihole

        definition:
          version: "3"
          networks:
            network-pihole:
              name: "custom-dns"
              external: true
          services:
            pihole:
              container_name: pihole
              image: "{{ pihole_docker_image }}"
              ports:
                - "53:53/tcp"
                - "53:53/udp"
                - "8081:80/tcp"
              environment:
                TZ: "{{ host_tz }}"
                WEBPASSWORD: "{{ pihole.password }}"
                PIHOLE_UID: "{{ host_puid }}"
                PIHOLE_GID: "{{ host_pgid }}"
              volumes:
                - '{{ pihole_config_dir }}/etc-pihole:/etc/pihole'
                - '{{ pihole_config_dir }}/etc-dnsmasq.d:/etc/dnsmasq.d'
                - '{{ pihole_backup_dir }}:/backups'
              restart: always
              networks:
                network-pihole:
                  ipv4_address: 172.31.0.2           #Internal Docker Address of pihole
