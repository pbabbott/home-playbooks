# Managed by Ansible (playbooks/k3s-template/tasks/chrony.yml). Used by the k3s template and gen3 nodes.
# hogwarts serves NTP to the LAN (playbooks/time-server); public sources are backup and let chrony reject a bad source.
server 192.168.4.196 iburst prefer
pool 2.pool.ntp.org iburst maxsources 2
server time.cloudflare.com iburst
server time.google.com iburst

driftfile /var/lib/chrony/chrony.drift
ntsdumpdir /var/lib/chrony
logdir /var/log/chrony

# Step the clock (instead of slewing) if off by >1s during the first 3 updates, e.g. after clone/boot or on RTC-less hosts.
makestep 1.0 3
rtcsync
leapsectz right/UTC
