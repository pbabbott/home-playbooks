---
# Provisions the k3s-ready Ubuntu 24.04 template (VMID 901). Run by Packer (packer/k3s-template),
# not by hand. Does NOT install k3s itself.
- name: Prepare k3s node template
  hosts: all
  become: true
  vars:
    host_tz: America/Chicago
  tasks:
    - name: Wait for first-boot cloud-init
      ansible.builtin.command: cloud-init status --wait
      register: ci_wait
      changed_when: false
      failed_when: ci_wait.rc not in [0, 2] # 2 = done with recoverable warnings

    - name: Upgrade packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist

    - name: Install packages
      ansible.builtin.apt:
        name:
          - qemu-guest-agent
          - nfs-common
          - open-iscsi
          - curl
          - ca-certificates
        state: present

    - name: Enable guest agent and iscsid
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
      loop:
        - qemu-guest-agent
        - iscsid

    - name: Set timezone
      community.general.timezone:
        name: "{{ host_tz }}"

    - name: Configure timesyncd
      ansible.builtin.copy:
        src: timesyncd.conf
        dest: /etc/systemd/timesyncd.conf
        mode: "0644"

    - name: Disable IPv6 via sysctl
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-disable-ipv6.conf
        mode: "0644"
        content: |
          net.ipv6.conf.all.disable_ipv6 = 1
          net.ipv6.conf.default.disable_ipv6 = 1
          net.ipv6.conf.lo.disable_ipv6 = 1

    - name: Disable IPv6 on kernel cmdline
      ansible.builtin.copy:
        dest: /etc/default/grub.d/99-disable-ipv6.cfg
        mode: "0644"
        content: |
          GRUB_CMDLINE_LINUX="$GRUB_CMDLINE_LINUX ipv6.disable=1"
      notify: Update grub

    - name: Load k3s kernel modules at boot
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k3s.conf
        mode: "0644"
        content: |
          overlay
          br_netfilter

    - name: Kubernetes sysctls
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-k3s.conf
        mode: "0644"
        content: |
          net.ipv4.ip_forward = 1
          net.bridge.bridge-nf-call-iptables = 1

    - name: Disable swap in fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

    # --- Cleanup so clones get unique identity ---
    - name: Clean apt
      ansible.builtin.apt:
        autoclean: true
        autoremove: true

    - name: Remove SSH host keys (regenerated by cloud-init on first boot)
      ansible.builtin.shell: rm -f /etc/ssh/ssh_host_*
      changed_when: true

    - name: Reset cloud-init
      ansible.builtin.command: cloud-init clean --logs
      changed_when: true

    - name: Truncate machine-id
      ansible.builtin.shell: truncate -s 0 /etc/machine-id && ln -sf /etc/machine-id /var/lib/dbus/machine-id
      changed_when: true

    - name: Trim filesystem
      ansible.builtin.command: fstrim -av
      changed_when: false
      failed_when: false

  handlers:
    - name: Update grub
      ansible.builtin.command: update-grub
      changed_when: true
