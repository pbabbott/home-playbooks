# Cleanly power off hogwarts for a physical move. See README.md.
# ansible-playbook -i inventories/physical -i inventories/gen3 -e @./vault.yml playbooks/hogwarts-shutdown/shutdown.yml
# Add -e confirm_shutdown=true to actually run (guard against accidents: this takes down the whole gen3 cluster and public ingress).

- name: Pre-flight and quiesce k3s (gen3)
  hosts: tf-prod-k3s-controller-1
  become: true
  gather_facts: false
  vars:
    drain_timeout: 120s
  tasks:
    - name: Require explicit confirmation
      ansible.builtin.assert:
        that: confirm_shutdown | default(false) | bool
        fail_msg: "Takes down all of gen3 (public ingress included). Re-run with -e confirm_shutdown=true"
      run_once: true

    - name: Save an etcd snapshot before shutdown
      ansible.builtin.command: k3s etcd-snapshot save --name pre-hogwarts-shutdown
      changed_when: true

    - name: List nodes
      ansible.builtin.command: k3s kubectl get nodes -o name
      register: nodes
      changed_when: false

    - name: Worker nodes (those not control-plane)
      ansible.builtin.command: >-
        k3s kubectl get nodes -l '!node-role.kubernetes.io/control-plane' -o name
      register: workers
      changed_when: false

    - name: Control-plane nodes
      ansible.builtin.command: >-
        k3s kubectl get nodes -l 'node-role.kubernetes.io/control-plane' -o name
      register: controllers
      changed_when: false

    - name: Cordon every node (stays cordoned across reboot; startup.yml uncordons)
      ansible.builtin.command: k3s kubectl cordon {{ item }}
      loop: "{{ nodes.stdout_lines }}"
      changed_when: true

    # Longhorn keeps a PDB (0 disruptions) on every instance-manager pod, so draining them always stalls.
    # They must not be evicted anyway: they serve the volume engines/replicas. Skip them, drain everything else.
    # --disable-eviction deletes pods directly: PDBs (e.g. Longhorn csi-provisioner, unsatisfiable once the
    # replacements sit Pending on cordoned nodes) are meaningless for a full shutdown. The gate below is the safety net.
    # Cordoned nodes mean evicted pods (Flux, operators included) stay Pending and nothing gets recreated.
    - name: Drain all nodes except Longhorn instance-managers (fatal if it fails)
      ansible.builtin.command: >-
        k3s kubectl drain {{ item }} --ignore-daemonsets --delete-emptydir-data --force
        --disable-eviction --pod-selector='longhorn.io/component!=instance-manager' --timeout={{ drain_timeout }}
      loop: "{{ workers.stdout_lines + controllers.stdout_lines }}"
      changed_when: true

    # Gate: do not touch any VM until every volume is detached (no in-flight I/O, replicas consistent).
    - name: Wait until every Longhorn volume is detached
      ansible.builtin.shell: >-
        k3s kubectl -n longhorn-system get volumes.longhorn.io
        -o jsonpath='{range .items[?(@.status.state!="detached")]}{.metadata.name}={.status.state}{"\n"}{end}'
      register: attached
      until: attached.stdout | trim | length == 0
      retries: 30
      delay: 10
      changed_when: false

- name: Shut down guests and hogwarts
  hosts: hogwarts
  gather_facts: false
  vars:
    # Order matters: workers, then controller-2, then controller-1 (cluster-init node), then the HAProxy LXC.
    vm_order: [212, 211, 214, 210]
    lxc_ids: [213]
    shutdown_timeout: 180
  tasks:
    - name: Shut down VMs in order (ACPI, waits up to the timeout, then forces stop)
      ansible.builtin.command: qm shutdown {{ item }} --timeout {{ shutdown_timeout }} --forceStop 1
      loop: "{{ vm_order }}"
      register: qm
      failed_when: qm.rc != 0 and 'not running' not in qm.stderr

    - name: Shut down LXCs
      ansible.builtin.command: pct shutdown {{ item }} --timeout 60 --forceStop 1
      loop: "{{ lxc_ids }}"
      register: pct
      failed_when: pct.rc != 0 and 'not running' not in pct.stderr

    - name: Confirm nothing is still running
      ansible.builtin.shell: "qm list | awk '$3==\"running\"'; pct list | awk '$2==\"running\"'"
      register: still
      changed_when: false
      failed_when: still.stdout | trim | length > 0

    - name: Flush disks
      ansible.builtin.command: sync
      changed_when: false

    - name: Power off hogwarts (connection drops)
      ansible.builtin.shell: sleep 2 && systemctl poweroff
      async: 1
      poll: 0
      changed_when: true
