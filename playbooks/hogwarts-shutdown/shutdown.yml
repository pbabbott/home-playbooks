# Cleanly power off hogwarts for a physical move. See README.md.
# ansible-playbook -i inventories/physical -i inventories/gen3 -e @./vault.yml playbooks/hogwarts-shutdown/shutdown.yml
# Add -e confirm_shutdown=true to actually run (guard against accidents: this takes down the whole gen3 cluster and public ingress).

- name: Pre-flight and quiesce k3s (gen3)
  hosts: tf-prod-k3s-controller-1
  become: true
  gather_facts: false
  vars:
    drain_timeout: 30s
  tasks:
    - name: Require explicit confirmation
      ansible.builtin.assert:
        that: confirm_shutdown | default(false) | bool
        fail_msg: "Takes down all of gen3 (public ingress included). Re-run with -e confirm_shutdown=true"
      run_once: true

    - name: Save an etcd snapshot before shutdown
      ansible.builtin.command: k3s etcd-snapshot save --name pre-hogwarts-shutdown
      changed_when: true

    - name: List nodes
      ansible.builtin.command: k3s kubectl get nodes -o name
      register: nodes
      changed_when: false

    - name: Worker nodes (those not control-plane)
      ansible.builtin.command: >-
        k3s kubectl get nodes -l '!node-role.kubernetes.io/control-plane' -o name
      register: workers
      changed_when: false

    - name: Control-plane nodes
      ansible.builtin.command: >-
        k3s kubectl get nodes -l 'node-role.kubernetes.io/control-plane' -o name
      register: controllers
      changed_when: false

    - name: Cordon every node (stays cordoned across reboot; startup.yml uncordons)
      ansible.builtin.command: k3s kubectl cordon {{ item }}
      loop: "{{ nodes.stdout_lines }}"
      changed_when: true

    # Longhorn keeps a PDB (0 disruptions) on every instance-manager pod, so draining them always stalls.
    # They must not be evicted anyway: they serve the volume engines/replicas. Skip them, drain everything else.
    # --disable-eviction deletes pods directly: PDBs (e.g. Longhorn csi-provisioner, unsatisfiable once the
    # replacements sit Pending on cordoned nodes) are meaningless for a full shutdown. The gate below is the safety net.
    # Cordoned nodes mean evicted pods (Flux, operators included) stay Pending and nothing gets recreated.
    # Nodes that are already off (e.g. chimaera's after chimaera-shutdown/) can never confirm pod deletion, so a drain
    # just burns the timeout: only drain Ready nodes, all in parallel.
    - name: Ready nodes (drain targets)
      ansible.builtin.shell: >-
        k3s kubectl get nodes --no-headers | awk '$2 ~ /^Ready/ {print "node/"$1}'
      register: ready_nodes
      changed_when: false

    - name: Drain Ready nodes in parallel, except Longhorn instance-managers (fatal if one fails)
      ansible.builtin.shell: |
        set -o pipefail
        printf '%s\n' {{ ready_nodes.stdout_lines | join(' ') }} | xargs -P 6 -I{} \
          k3s kubectl drain {} --ignore-daemonsets --delete-emptydir-data --force \
          --disable-eviction --pod-selector='longhorn.io/component!=instance-manager' --timeout={{ drain_timeout }}
      args:
        executable: /bin/bash
      changed_when: true

    # Gate: do not touch any VM until every volume is detached (no in-flight I/O, replicas consistent).
    - name: Wait until every Longhorn volume is detached
      ansible.builtin.shell: >-
        k3s kubectl -n longhorn-system get volumes.longhorn.io
        -o jsonpath='{range .items[?(@.status.state!="detached")]}{.metadata.name}={.status.state}{"\n"}{end}'
      register: attached
      until: attached.stdout | trim | length == 0
      retries: 30
      delay: 10
      changed_when: false

# Stop k3s + containerd (and unmount their volumes) ourselves, in parallel, before asking Proxmox to power the VMs
# off. Left to systemd this took the full 180 s ACPI timeout per VM on 2026-11-23 (then a force-stop).
# Only the hogwarts VMs: chimaera's are already off or are not ours to touch here.
- name: Stop k3s on the hogwarts nodes (workers first, then controllers)
  hosts: tf-prod-k3s-worker-1:tf-prod-k3s-worker-2
  become: true
  gather_facts: false
  tasks:
    - name: k3s-killall (stops k3s, kills containers, unmounts)
      ansible.builtin.command: /usr/local/bin/k3s-killall.sh
      changed_when: true
      ignore_unreachable: true

- name: Stop k3s on the hogwarts controllers
  hosts: tf-prod-k3s-controller-1:tf-prod-k3s-controller-2
  become: true
  gather_facts: false
  tasks:
    - name: k3s-killall (stops k3s, kills containers, unmounts)
      ansible.builtin.command: /usr/local/bin/k3s-killall.sh
      changed_when: true
      ignore_unreachable: true

- name: Shut down guests and hogwarts
  hosts: hogwarts
  gather_facts: false
  vars:
    vm_ids: [212, 211, 214, 210]
    lxc_ids: [213]
    shutdown_timeout: 60
  tasks:
    # All guests in parallel (k3s is already stopped, so there is no ordering left to respect).
    - name: Shut down VMs and LXCs in parallel (ACPI, force-stop after the timeout)
      ansible.builtin.shell: |
        for id in {{ vm_ids | join(' ') }}; do
          qm shutdown $id --timeout {{ shutdown_timeout }} --forceStop 1 2>&1 | grep -v 'not running' &
        done
        for id in {{ lxc_ids | join(' ') }}; do
          pct shutdown $id --timeout {{ shutdown_timeout }} --forceStop 1 2>&1 | grep -v 'not running' &
        done
        wait
      args:
        executable: /bin/bash
      changed_when: true

    - name: Confirm nothing is still running
      ansible.builtin.shell: "qm list | awk '$3==\"running\"'; pct list | awk '$2==\"running\"'"
      register: still
      changed_when: false
      failed_when: still.stdout | trim | length > 0

    - name: Flush disks
      ansible.builtin.command: sync
      changed_when: false

    - name: Power off hogwarts (connection drops)
      ansible.builtin.shell: sleep 2 && systemctl poweroff
      async: 1
      poll: 0
      changed_when: true
