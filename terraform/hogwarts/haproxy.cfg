# gen3 ingress for the k3s cluster on hogwarts. Replaces the gen2 LXC on chimaera (192.168.6.28).
# Istio ingress runs as NodePort 30080 (HTTP) / 30443 (HTTPS) on every worker and expects PROXY protocol v2
# (see home-kubernetes infra/base/istio, numTrustedProxies: 1).
# All hostnames go to the single gen3 cluster; add host ACLs here if a second cluster ever shares this proxy.
global
  stats socket /var/run/api.sock user haproxy group haproxy mode 660 level admin expose-fd listeners
  log stdout format raw local0 debug

defaults
  mode http
  timeout client 10s
  timeout connect 5s
  timeout server 10s
  timeout http-request 10s
  timeout tunnel 1h
  log global
  option httplog
  option tcplog
  option logasap

frontend stats
  bind *:8404
  mode http
  http-request use-service prometheus-exporter if { path /metrics }
  stats enable
  stats uri /
  stats refresh 10s

frontend frontend-http
  bind *:80
  option httplog
  # Allow LAN (192.168.4.0/22) and Cloudflare IPv4 ranges (https://www.cloudflare.com/ips-v4/); deny everything else with 403.
  acl allowed_src src 192.168.4.0/22 173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22
  http-request deny deny_status 403 unless allowed_src
  default_backend gen3-cluster-http

backend gen3-cluster-http
  option forwardfor
  server k3sw1 192.168.6.42:30080 check send-proxy-v2
  server k3sw2 192.168.6.43:30080 check send-proxy-v2
  server k3sw3 192.168.6.46:30080 check send-proxy-v2

frontend frontend-https
  bind *:443
  mode tcp
  option tcplog
  acl allowed_src src 192.168.4.0/22 173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22
  tcp-request connection reject unless allowed_src
  default_backend gen3-cluster-https

backend gen3-cluster-https
  mode tcp
  server k3sw1 192.168.6.42:30443 check send-proxy-v2
  server k3sw2 192.168.6.43:30443 check send-proxy-v2
  server k3sw3 192.168.6.46:30443 check send-proxy-v2
