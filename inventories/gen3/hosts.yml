---
# gen3 k3s fleet on hogwarts and chimaera (terraform/hogwarts, terraform/chimaera). Key auth as firebolt (key injected via cloud-init), passwordless sudo.
all:
  children:
    kubernetes_controllers:
      hosts:
        tf-prod-k3s-controller-1:   # first host runs cluster-init
        tf-prod-k3s-controller-2:   # hogwarts; retire when dumbledore joins
        tf-prod-k3s-controller-3:   # chimaera

    kubernetes_workers:
      hosts:
        tf-prod-k3s-worker-1:
        tf-prod-k3s-worker-2:
        tf-prod-k3s-worker-3:       # chimaera

  vars:
    ansible_user: firebolt
    host_type: virtual

  hosts:
    tf-prod-k3s-controller-1:
      ansible_host: 192.168.6.41
    tf-prod-k3s-controller-2:
      ansible_host: 192.168.6.44
    tf-prod-k3s-controller-3:
      ansible_host: 192.168.6.45
    tf-prod-k3s-worker-1:
      ansible_host: 192.168.6.42
    tf-prod-k3s-worker-2:
      ansible_host: 192.168.6.43
    tf-prod-k3s-worker-3:
      ansible_host: 192.168.6.46
