---
# Physical hosts + standalone VMs (non-Terraform). k8s fleets live in ../prod and ../nonprod.
# Usage: ansible-playbook -i inventories/physical -e @./vault.yml playbooks/<name>/<file>.yml
all:
  children:
    web_servers:
      hosts:
        bananapi:

  hosts:
    bananapi:
      ansible_host: 192.168.4.144
      ansible_user: pi
      ansible_password: "{{ inventoryPasswords.bananapi }}"
      ansible_sudo_pass: "{{ inventoryPasswords.bananapi }}"
      host_type: physical
    dumbledore:
      ansible_host: 192.168.4.157
      ansible_user: albus
      ansible_password: "{{ inventoryPasswords.dumbledore }}"
      ansible_sudo_pass: "{{ inventoryPasswords.dumbledore }}"
      host_type: physical
    ansible-template-ubuntu-noble:
      ansible_host: 192.168.6.91
      ansible_user: firebolt
      ansible_password: "{{ inventoryPasswords.kubernetes_node }}"
      ansible_sudo_pass: "{{ inventoryPasswords.kubernetes_node }}"
      host_type: template
    marauders_map:
      ansible_host: 192.168.5.91
      ansible_user: firebolt
      ansible_password: "{{ inventoryPasswords.kubernetes_node }}"
      ansible_sudo_pass: "{{ inventoryPasswords.kubernetes_node }}"
      host_type: virtual
    chimaera:
      ansible_host: 192.168.4.192
      ansible_user: root
      ansible_password: "{{ inventoryPasswords.chimaera }}"
      ansible_sudo_pass: "{{ inventoryPasswords.chimaera }}"
      host_type: physical
    hogwarts:
      ansible_host: 192.168.4.196
      ansible_user: root
      ansible_password: "{{ inventoryPasswords.hogwarts }}"
      ansible_sudo_pass: "{{ inventoryPasswords.hogwarts }}"
      host_type: physical
    elder_wand:
      # ansible_host: 192.168.4.90 # Ethernet (old)
      # ansible_host: 192.168.4.134 # Wi-Fi (old, unknown if still valid)
      ansible_host: 192.168.5.142 # Ethernet (reserved)
      ansible_winrm_port: 5985
      ansible_connection: winrm
      ansible_winrm_scheme: http
      ansible_winrm_server_cert_validation: ignore
      ansible_winrm_transport: ntlm
      ansible_user: pbabb
      ansible_password: "{{ inventoryPasswords.elder_wand }}"
      host_type: physical
      shutdown_exempt: true
    room_of_requirement:
      ansible_host: 192.168.4.124
      ansible_user: pabbott
      ansible_password: "{{ inventoryPasswords.room_of_requirement }}"
      ansible_sudo_pass: "{{ inventoryPasswords.room_of_requirement }}"
      host_type: physical
